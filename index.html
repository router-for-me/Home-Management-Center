<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Home Management Center for AI gateway runtimes" />
    <title>Home Management Center</title>
    <script>
      try {
        const preset = localStorage.getItem('home-management-center.themePreset')
        if (preset) {
          document.documentElement.dataset.themePreset = preset
        }
      } catch {
        // Ignore storage access failures and fall back to the default preset.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
